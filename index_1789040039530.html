<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
<title>مذاكرتي</title>
<meta name="description" content="منظّم دراستك الذكي — مؤقت بومودورو، درجات شهرية، مواعيد، وقت فاضي" />
<meta name="theme-color" content="#2563eb" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="مذاكرتي" />
<link rel="manifest" href="./manifest_1789040039533.json" />
<link rel="icon" type="image/png" href="./icon-192.png" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#2563eb;--blue-light:#eff6ff;--blue-dark:#1d4ed8;--blue-glow:rgba(37,99,235,.25);
  --green:#059669;--green-light:#ecfdf5;--amber:#d97706;--amber-light:#fffbeb;
  --red:#dc2626;--red-light:#fef2f2;--purple:#7c3aed;--purple-light:#f5f3ff;
  --bg:#0f172a;--bg2:#1e293b;--surface:#1e293b;--surface2:#263348;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;
  --border:rgba(148,163,184,.14);--border2:rgba(148,163,184,.24);
  --radius:16px;--radius-sm:10px;
  --font:"Cairo",Tahoma,Arial,sans-serif;--mono:"JetBrains Mono",monospace;
  --shadow:0 4px 24px rgba(0,0,0,.35);
}
html.light-mode{
  --bg:#f1f5f9;--bg2:#e2e8f0;--surface:#ffffff;--surface2:#f8fafc;
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --border:rgba(15,23,42,.08);--border2:rgba(15,23,42,.16);
  --blue-light:#eff6ff;--green-light:#ecfdf5;--amber-light:#fffbeb;--red-light:#fef2f2;--purple-light:#f5f3ff;
  --shadow:0 4px 20px rgba(15,23,42,.08);
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);direction:rtl;transition:background .2s,color .2s}
body{padding-bottom:env(safe-area-inset-bottom)}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
header{padding:18px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:19px;font-weight:800;white-space:nowrap}
.header-right{display:flex;align-items:center;gap:8px}
.streak-pill{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);padding:6px 10px;border-radius:20px;font-size:12px;font-weight:700;color:var(--amber);white-space:nowrap}
.icon-btn{background:var(--surface2);border:1px solid var(--border);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;flex-shrink:0}
main{flex:1;padding:6px 16px 100px;overflow-y:auto}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h2 .t{display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-box{background:var(--surface2);border-radius:var(--radius-sm);padding:14px;text-align:center}
.stat-box .num{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--blue)}
.stat-box .lbl{font-size:11px;color:var(--text2);margin-top:4px}
.btn{border:none;border-radius:var(--radius-sm);padding:13px 18px;font-family:var(--font);font-weight:700;font-size:15px;cursor:pointer;transition:.15s}
.btn-primary{background:var(--blue);color:#fff;width:100%}
.btn-primary:active{background:var(--blue-dark)}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}
.btn-danger{background:var(--red-light);color:var(--red)}
.btn-sm{padding:8px 14px;font-size:13px}
.btn-seg{background:transparent;color:var(--text2);border:1px solid var(--border2)}
.btn-seg.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.row{display:flex;gap:10px}
.row.wrap{flex-wrap:wrap}
input,select,textarea{background:var(--surface2);border:1px solid var(--border2);color:var(--text);border-radius:var(--radius-sm);padding:11px 12px;font-family:var(--font);font-size:14px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue)}
label{font-size:12px;color:var(--text2);font-weight:700;margin-bottom:5px;display:block}
.field{margin-bottom:10px}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px}
.checkbox-row input{width:auto}
/* Timer */
.timer-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0 6px}
.timer-ring{position:relative;width:220px;height:220px}
.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:12}
.ring-bg{stroke:var(--surface2)}
.ring-fg{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.timer-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px;text-align:center}
.timer-time{font-family:var(--mono);font-size:40px;font-weight:700}
.timer-phase{font-size:12px;color:var(--text2);margin-top:6px;font-weight:700}
.timer-subject{font-size:11px;color:var(--blue);margin-top:2px;font-weight:700}
.mode-toggle{display:flex;background:var(--surface2);border-radius:var(--radius-sm);padding:4px;gap:4px;margin-bottom:14px}
.mode-toggle button{flex:1;background:transparent;border:none;color:var(--text2);padding:9px;border-radius:8px;font-family:var(--font);font-weight:700;font-size:13px;cursor:pointer}
.mode-toggle button.active{background:var(--blue);color:#fff}
.timer-controls{display:flex;gap:10px;margin-top:18px;width:100%}
.round-dots{display:flex;gap:6px;margin-top:10px}
.round-dots span{width:8px;height:8px;border-radius:50%;background:var(--surface2)}
.round-dots span.done{background:var(--blue)}
/* weekly chart */
.chart{display:flex;align-items:flex-end;gap:8px;height:100px;margin:10px 0}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .bar{width:100%;background:var(--blue);border-radius:5px 5px 0 0;min-height:3px}
.chart .day{font-size:10px;color:var(--text3)}
/* subjects/grades */
.subject-item{border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px}
.subject-top{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px}
.subject-name{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
.badge{font-size:11px;font-weight:800;padding:4px 9px;border-radius:20px;white-space:nowrap}
.grade-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--border);font-size:13px;gap:6px}
.grade-row .pct{font-family:var(--mono);font-weight:700}
.progress-bar{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden;margin-top:8px}
.progress-bar > div{height:100%;border-radius:5px}
.month-group{margin-top:10px}
.month-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:var(--text2);padding:6px 0}
.sort-toggle{display:flex;gap:6px;margin-bottom:12px}
/* free time */
.ft-bar{display:flex;height:32px;border-radius:8px;overflow:hidden;margin:12px 0}
.ft-bar div{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--text2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.day-tabs{display:flex;gap:5px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.day-tabs button{flex-shrink:0;background:var(--surface2);border:1px solid var(--border2);color:var(--text2);padding:8px 12px;border-radius:20px;font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer}
.day-tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.suggest-box{background:var(--green-light);color:var(--green);border-radius:var(--radius-sm);padding:12px;font-size:13px;font-weight:700;margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
/* schedule/reminders + todos */
.rem-item{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;gap:8px}
.rem-info .title{font-weight:800;font-size:14px}
.rem-info .meta{font-size:11px;color:var(--text2);margin-top:3px}
.countdown{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--blue);white-space:nowrap}
.countdown.soon{color:var(--red)}
.todo-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border)}
.todo-item.done .txt{text-decoration:line-through;color:var(--text3)}
.todo-item .txt{flex:1;font-size:14px}
.tab-mini{display:flex;background:var(--surface2);border-radius:var(--radius-sm);padding:4px;gap:4px;margin-bottom:14px}
.tab-mini button{flex:1;background:transparent;border:none;color:var(--text2);padding:9px;border-radius:8px;font-family:var(--font);font-weight:700;font-size:13px;cursor:pointer}
.tab-mini button.active{background:var(--blue);color:#fff}
/* points/level */
.level-box{display:flex;align-items:center;gap:14px}
.level-circle{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:18px;flex-shrink:0}
/* alerts */
.alert-box{background:var(--red-light);color:var(--red);border-radius:var(--radius-sm);padding:12px;font-size:13px;font-weight:700;margin-bottom:12px}
/* tabbar */
nav.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabbar button{flex:1;background:transparent;border:none;color:var(--text3);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 1px;font-family:var(--font);font-size:10px;font-weight:700;cursor:pointer}
nav.tabbar button .ic{font-size:19px}
nav.tabbar button.active{color:var(--blue)}
.empty{text-align:center;color:var(--text3);font-size:13px;padding:20px 10px}
.muted{color:var(--text2);font-size:12px}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--surface);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-head h2{font-size:16px;font-weight:800}
::-webkit-scrollbar{width:0}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>📘 مذاكرتي</h1>
    <div class="header-right">
      <div class="streak-pill" id="streakPill">🔥 0</div>
      <button class="icon-btn" id="settingsBtn">⚙️</button>
    </div>
  </header>
  <main id="view"></main>
  <nav class="tabbar">
    <button data-tab="home"><span class="ic">🏠</span>الرئيسية</button>
    <button data-tab="timer"><span class="ic">⏱️</span>المؤقت</button>
    <button data-tab="grades"><span class="ic">🎯</span>الدرجات</button>
    <button data-tab="schedule"><span class="ic">📅</span>المواعيد</button>
    <button data-tab="free"><span class="ic">🕐</span>وقت فاضي</button>
  </nav>
  <div id="modalRoot"></div>
</div>

<script>
/* ===================== STATE ===================== */
const STORE_KEY = "mazakrati_state_v3";
const ARABIC_MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const WEEKDAYS = ["أحد","اثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"];

function freshWeek(){
  const w = {};
  for(let i=0;i<7;i++) w[i] = {sleep:8, work:8, other:2};
  return w;
}
const defaultState = {
  tab: "home",
  theme: "dark",
  subjects: [],            // {id,name,grades:[{id,score,total,label,month:'YYYY-MM',date}]}
  sessions: [],             // {date:'YYYY-MM-DD', minutes, subjectId, ts}
  reminders: [],            // {id,title,subjectId,datetime,notes}
  todos: [],                 // {id,text,done,subjectId,date}
  points: 0,
  settings: {
    studyMin:25, shortBreak:5, longBreak:15, roundsUntilLong:4, prepMin:5,
    sound:"classic", vibration:true, wakeLock:true, weakThreshold:65
  },
  freeTime: { week: freshWeek() }
};

let state = load();

function load(){
  let s;
  try{
    const raw = localStorage.getItem(STORE_KEY);
    s = raw ? JSON.parse(raw) : structuredClone(defaultState);
  }catch(e){ s = structuredClone(defaultState); }
  return normalizeState(s);
}
function normalizeState(data){
  const s = Object.assign(structuredClone(defaultState), data||{});
  s.settings = normalizeSettings(s.settings);
  s.sessions = Array.isArray(s.sessions) ? s.sessions : [];
  s.reminders = Array.isArray(s.reminders) ? s.reminders : [];
  s.todos = Array.isArray(s.todos) ? s.todos : [];
  s.points = Number.isFinite(Number(s.points)) ? Math.max(0, Number(s.points)) : 0;
  s.subjects = (Array.isArray(s.subjects) ? s.subjects : []).map(sub=>({
    ...sub,
    id: sub.id || uid(),
    name: String(sub.name||"").trim(),
    grades:(Array.isArray(sub.grades) ? sub.grades : [])
      .filter(g=>Number.isFinite(Number(g.score)) && Number(g.total)>0)
      .map(g=>({...g, score:Number(g.score), total:Number(g.total), month: g.month || (g.date? g.date.slice(0,7) : currentMonthKey())}))
  }));
  const week = freshWeek();
  for(let i=0;i<7;i++){
    const day = s.freeTime && s.freeTime.week && s.freeTime.week[i];
    if(day){
      ["sleep","work","other"].forEach(key=>{
        const value = Number(day[key]);
        if(Number.isFinite(value)) week[i][key] = Math.max(0, Math.min(24, value));
      });
    }
  }
  s.freeTime = { week };
  return s;
}
function normalizeSettings(settings){
  const s = Object.assign({}, defaultState.settings, settings||{});
  const intValue = (value, fallback, min) => {
    const parsed = Number.parseInt(value, 10);
    return Number.isFinite(parsed) ? Math.max(min, parsed) : fallback;
  };
  const threshold = Number.parseFloat(s.weakThreshold);
  return {
    ...s,
    studyMin: intValue(s.studyMin, defaultState.settings.studyMin, 1),
    shortBreak: intValue(s.shortBreak, defaultState.settings.shortBreak, 1),
    longBreak: intValue(s.longBreak, defaultState.settings.longBreak, 1),
    roundsUntilLong: intValue(s.roundsUntilLong, defaultState.settings.roundsUntilLong, 1),
    prepMin: intValue(s.prepMin, defaultState.settings.prepMin, 0),
    weakThreshold: Number.isFinite(threshold) ? Math.min(100, Math.max(0, threshold)) : defaultState.settings.weakThreshold
  };
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); applyTheme(); }
function applyTheme(){ document.documentElement.classList.toggle("light-mode", state.theme==="light"); }

function todayKey(d = new Date()){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function currentMonthKey(d=new Date()){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function formatMonth(ym){ if(!ym) return ""; const [y,m]=ym.split("-"); return ARABIC_MONTHS[parseInt(m)-1]+" "+y; }
function minutesOn(dateKey){ return state.sessions.filter(s=>s.date===dateKey).reduce((a,s)=>a+s.minutes,0); }
function logMinutes(mins, subjectId, withPoints){
  if(mins<=0) return;
  state.sessions.push({date:todayKey(), minutes:mins, subjectId: subjectId||null, ts:Date.now()});
  if(withPoints) state.points += 10;
  save();
}
function computeStreak(){
  let streak=0; let d = new Date();
  if(minutesOn(todayKey(d))>0){ streak++; d.setDate(d.getDate()-1); }
  while(minutesOn(todayKey(d))>0){ streak++; d.setDate(d.getDate()-1); }
  return streak;
}
function levelOf(pct){
  if(pct>=90) return {label:"ممتاز", color:"var(--green)", bg:"var(--green-light)"};
  if(pct>=80) return {label:"جيد جدًا", color:"var(--blue)", bg:"var(--blue-light)"};
  if(pct>=65) return {label:"جيد", color:"var(--amber)", bg:"var(--amber-light)"};
  if(pct>=50) return {label:"مقبول", color:"var(--amber)", bg:"var(--amber-light)"};
  return {label:"ضعيف", color:"var(--red)", bg:"var(--red-light)"};
}
function subjectAvg(subj){
  const pcts = subj.grades.map(gradePct).filter(p=>p!==null);
  return pcts.length ? pcts.reduce((a,b)=>a+b,0)/pcts.length : null;
}
function gradePct(g){
  const score = Number(g.score), total = Number(g.total);
  return Number.isFinite(score) && Number.isFinite(total) && total>0 ? score/total*100 : null;
}
function levelRank(){ return Math.floor(state.points/100)+1; }
function uid(){ return Math.random().toString(36).slice(2,9); }
function fmtTime(totalSec){ const m=Math.floor(totalSec/60), s=totalSec%60; return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }
function escapeHtml(s){ return (s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ===================== SOUND / VIBRATION / WAKE LOCK ===================== */
let audioCtx = null;
function beep(){
  try{
    const AudioContextClass = window.AudioContext||window.webkitAudioContext;
    if(!AudioContextClass) throw new Error("AudioContext unavailable");
    if(!audioCtx || audioCtx.state==="closed") audioCtx = new AudioContextClass();
    const ctx = audioCtx;
    if(ctx.state==="suspended") ctx.resume().catch(()=>{});
    let t = ctx.currentTime + 0.02;
    const patterns = {
      classic:[784,988,1175,988],
      soft:[659,784,988],
      chime:[523,659,784,1047]
    };
    const freqs = patterns[state.settings.sound] || patterns.classic;
    freqs.forEach(f=>{
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type="sine"; o.frequency.value=f;
      o.connect(g); g.connect(ctx.destination);
      // صوت أعلى من السابق مع دخول وخروج تدريجي لتجنب الطقطقة.
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3, t+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t+0.24);
      o.start(t); o.stop(t+0.25);
      t += 0.3;
    });
  }catch(e){}
  if(state.settings.vibration && navigator.vibrate){ try{ navigator.vibrate([200,80,200]); }catch(e){} }
}
function requestNotificationPermission(){
  if(!("Notification" in window) || Notification.permission!=="default") return Promise.resolve(Notification.permission);
  return Notification.requestPermission().catch(()=> "denied");
}
function notify(title, body){
  beep();
  if("Notification" in window && Notification.permission==="granted"){
    try{
      new Notification(title,{
        body,
        icon:"./icon-192.png",
        tag:"mazakrati-timer",
        renotify:true,
        silent:false,
        requireInteraction:true
      });
    }catch(e){}
  }
}
let wakeLockRef = null;
async function requestWake(){
  if(!state.settings.wakeLock || !("wakeLock" in navigator)) return;
  try{
    const lock = await navigator.wakeLock.request("screen");
    if(timer.running && (timer.phase==="work" || timer.phase==="simple")) wakeLockRef = lock;
    else lock.release().catch(()=>{});
  }catch(e){}
}
function releaseWake(){ try{ wakeLockRef && wakeLockRef.release(); }catch(e){} wakeLockRef=null; }

/* ===================== TIMER ENGINE ===================== */
const timer = {
  mode:"pomodoro", phase:"idle", round:1, running:false,
  endAt:null, remainingMs:null, totalMs:null, simpleMinutes:25,
  subjectId:null, interval:null
};
function phaseDurationMs(){
  const s = state.settings;
  switch(timer.phase){
    case "prep": return s.prepMin*60000;
    case "work": return s.studyMin*60000;
    case "short": return s.shortBreak*60000;
    case "long": return s.longBreak*60000;
    case "simple": return timer.simpleMinutes*60000;
    default: return 0;
  }
}
function phaseLabel(){
  return { idle:"جاهز للبدء", prep:"استعد للجلسة…", work:"وقت المذاكرة",
           short:"استراحة قصيرة", long:"استراحة طويلة", simple:"جلسة مذاكرة" }[timer.phase];
}
function startPhase(phase){
  clearInterval(timer.interval);
  timer.phase = phase;
  timer.totalMs = phaseDurationMs();
  timer.remainingMs = timer.totalMs;
  timer.endAt = Date.now() + timer.totalMs;
  timer.running = true;
  if(phase==="work"||phase==="simple") requestWake(); else releaseWake();
  runInterval();
}
function currentRemainingMs(){
  if(timer.phase==="idle") return 0;
  if(timer.running && timer.endAt!==null) return Math.max(0, timer.endAt-Date.now());
  return Math.max(0, Number(timer.remainingMs)||0);
}
function elapsedTimerMs(){
  return Math.max(0, (timer.totalMs||0)-currentRemainingMs());
}
function pauseTimer(){
  if(!timer.running) return;
  timer.remainingMs = currentRemainingMs();
  timer.running = false;
  clearInterval(timer.interval);
  timer.endAt = null;
  releaseWake();
  render();
}
function resumeTimer(){
  if(timer.running || timer.phase==="idle") return;
  if(timer.remainingMs<=0){ onPhaseComplete(); return; }
  timer.endAt = Date.now() + timer.remainingMs;
  timer.running = true;
  if(timer.phase==="work"||timer.phase==="simple") requestWake();
  runInterval();
  render();
}
function resetTimer(recordPartial=true){
  clearInterval(timer.interval);
  // لو المستخدم قفل الجلسة قبل ما العداد يخلص، سجّل الدقايق اللي فعلاً ذاكرها بس من غير نقط
  if(recordPartial && (timer.phase==="work" || timer.phase==="simple") && timer.totalMs){
    const elapsedMs = elapsedTimerMs();
    const elapsedMin = Math.floor(elapsedMs/60000);
    if(elapsedMin>0) logMinutes(elapsedMin, timer.subjectId, false);
  }
  timer.phase="idle"; timer.running=false; timer.round=1;
  timer.endAt=null; timer.remainingMs=null; timer.totalMs=null;
  releaseWake();
  render();
}
function beginSession(){
  requestNotificationPermission();
  if(state.settings.prepMin>0){ timer.round=1; startPhase("prep"); }
  else { timer.round=1; startPhase(timer.mode==="pomodoro"?"work":"simple"); }
  render();
}
function runInterval(){
  clearInterval(timer.interval);
  timer.interval = setInterval(()=>{
    const remain = currentRemainingMs();
    timer.remainingMs = remain;
    if(remain<=0){
      clearInterval(timer.interval);
      timer.running = false;
      timer.endAt = null;
      onPhaseComplete();
    }
    else render(true);
  }, 250);
}
function reconcileTimer(){
  if(!timer.running || timer.endAt===null) return;
  const remain = Math.max(0, timer.endAt-Date.now());
  timer.remainingMs = remain;
  if(remain<=0){
    clearInterval(timer.interval);
    timer.running = false;
    timer.endAt = null;
    onPhaseComplete();
  }else{
    if(timer.phase==="work" || timer.phase==="simple") requestWake();
    runInterval();
  }
  render();
}
function onPhaseComplete(){
  const finishedWork = (timer.phase==="work" || timer.phase==="simple");
  const completedPhase = timer.phase;
  const completedMs = timer.totalMs;
  timer.running = false;
  timer.remainingMs = 0;
  timer.endAt = null;
  if(finishedWork) logMinutes(Math.round(completedMs/60000), timer.subjectId, true);

  if(completedPhase==="prep"){
    notify("انتهى وقت الاستعداد ⏳","بدأت جلسة المذاكرة الآن");
    startPhase(timer.mode==="pomodoro" ? "work" : "simple"); return;
  }
  if(completedPhase==="simple"){
    notify("أحسنت! 🎉","انتهت جلسة المذاكرة");
    // الجلسة اتسجلت بالفعل فوق؛ لا تسجلها مرة ثانية أثناء التصفير.
    resetTimer(false); return;
  }
  if(completedPhase==="work"){
    const isLong = timer.round % state.settings.roundsUntilLong === 0;
    notify("وقت الاستراحة ☕", isLong? "استراحة طويلة استحقيتها" : "خد استراحة قصيرة");
    startPhase(isLong ? "long" : "short"); return;
  }
  if(completedPhase==="short" || completedPhase==="long"){
    if(completedPhase==="short") timer.round++; else timer.round=1;
    notify("يلا نكمل 💪","بدأت جولة مذاكرة جديدة");
    startPhase("work"); return;
  }
}

function countdownText(d){
  const ms = d-new Date();
  if(ms<=0) return "الآن";
  const days = Math.floor(ms/86400000);
  const hours = Math.floor((ms%86400000)/3600000);
  if(days>0) return `بعد ${days} يوم`;
  const mins = Math.floor((ms%3600000)/60000);
  if(hours>0) return `بعد ${hours} س`;
  return `بعد ${mins} د`;
}

function phasePreviewMs(){ return timer.mode==="pomodoro" ? state.settings.studyMin*60000 : timer.simpleMinutes*60000; }
function renderDots(){
  const n = state.settings.roundsUntilLong; let html="";
  for(let i=1;i<=n;i++) html += `<span class="${i<timer.round?'done':''}"></span>`;
  return html;
}
function updateTimerDom(){
  const timeLbl = document.getElementById("timeLbl");
  const phaseLbl = document.getElementById("phaseLbl");
  const ring = document.getElementById("ringFg");
  if(!timeLbl) return;
  const remain = timer.phase==="idle" ? phasePreviewMs() : currentRemainingMs();
  timeLbl.textContent = fmtTime(Math.round(remain/1000));
  phaseLbl.textContent = phaseLabel();
  if(ring && timer.totalMs){
    const circumference = 326.7;
    const progress = Math.min(1, Math.max(0, remain/timer.totalMs));
    ring.setAttribute("stroke-dashoffset", String(circumference*(1-progress)));
  }
  const dots = document.getElementById("roundDots");
  if(dots) dots.innerHTML = renderDots();
}

      <div class="ft-bar">${bar}</div>
      <div class="legend">${segs.map(s=>`<span><i class="dot" style="background:${s.color}"></i>${s.label} (${s.val}س)</span>`).join("")}</div>
      <div class="stat-box" style="margin-top:16px">
        <div class="num" style="color:var(--green)">${free} ساعة</div>
        <div class="lbl">وقتك الفاضي المتاح</div>
      </div>
      ${free>=1 ? `<div class="suggest-box"><span>عندك ${free} ساعة فاضية${isToday?' النهاردة':''}، تعمل منها جلسة مذاكرة؟</span><button class="btn btn-primary btn-sm" id="suggestStart">ابدأ</button></div>` : ""}
    </div>
    <div class="card">
      <h2>✏️ عدّل ساعات يوم ${WEEKDAYS[dayIdx]}</h2>
      <div class="field"><label>ساعات النوم</label><input type="number" id="ft_sleep" value="${f.sleep}" min="0" max="24" step="0.5"/></div>
      <div class="field"><label>ساعات الشغل / المدرسة</label><input type="number" id="ft_work" value="${f.work}" min="0" max="24" step="0.5"/></div>
      <div class="field"><label>التزامات أخرى</label><input type="number" id="ft_other" value="${f.other}" min="0" max="24" step="0.5"/></div>
      ${isToday? `<p class="muted">وقت المذاكرة بيتحسب تلقائي من المؤقت (${studyHrs} ساعة)</p>`:""}
    </div>`;
}

/* ---- SETTINGS MODAL ---- */
function openSettings(){
  const s = state.settings;
  document.getElementById("modalRoot").innerHTML = `
    <div class="overlay" id="ovl">
      <div class="modal">
        <div class="modal-head"><h2>⚙️ الإعدادات</h2><button class="icon-btn" id="closeSettings">✕</button></div>
        <div class="card">
          <h2>🎨 المظهر</h2>
          <div class="row">
            <button class="btn btn-seg ${state.theme==='dark'?'active':''}" data-theme="dark" style="flex:1">🌙 داكن</button>
            <button class="btn btn-seg ${state.theme==='light'?'active':''}" data-theme="light" style="flex:1">☀️ فاتح</button>
          </div>
        </div>
        <div class="card">
          <h2>🔔 التنبيهات</h2>
          <div class="field"><label>نغمة التنبيه</label>
            <select id="soundSelect">
              <option value="classic" ${s.sound==='classic'?'selected':''}>كلاسيك</option>
              <option value="soft" ${s.sound==='soft'?'selected':''}>هادئة</option>
              <option value="chime" ${s.sound==='chime'?'selected':''}>جرس</option>
            </select>
          </div>
          <div class="checkbox-row" style="margin-bottom:10px"><input type="checkbox" id="vibToggle" ${s.vibration?"checked":""}/><label style="margin:0">اهتزاز الموبايل</label></div>
          <div class="checkbox-row" style="margin-bottom:10px"><input type="checkbox" id="wakeToggle" ${s.wakeLock?"checked":""}/><label style="margin:0">خلي الشاشة صاحية أثناء المذاكرة</label></div>
          <button class="btn btn-ghost btn-sm" id="notifPermBtn">تفعيل إشعارات المتصفح</button>
        </div>
        <div class="card">
          <h2>🎯 حد الإنذار للمادة الضعيفة</h2>
          <input type="number" id="weakThresh" value="${s.weakThreshold}" min="0" max="100"/>
        </div>
        <div class="card">
          <h2>💾 نسخة احتياطية</h2>
          <div class="row">
            <button class="btn btn-ghost btn-sm" id="exportBtn" style="flex:1">تصدير البيانات</button>
            <label class="btn btn-ghost btn-sm" style="flex:1;text-align:center;cursor:pointer">استيراد
              <input type="file" id="importFile" accept="application/json" style="display:none"/>
            </label>
          </div>
        </div>
        <div class="card">
          <h2>🏆 إعادة تعيين المستوى</h2>
          <p class="muted" style="margin-bottom:10px">بيصفّر نقاطك ومستواك بس، من غير ما يمسح درجاتك أو جلساتك. محتاج باسورد.</p>
          <button class="btn btn-danger" id="resetPointsBtn" style="width:100%">إعادة تعيين المستوى</button>
        </div>
      </div>
    </div>`;
  const ov = document.getElementById("ovl");
  ov.addEventListener("click", e=>{ if(e.target.id==="ovl") closeSettings(); });
  document.getElementById("closeSettings").addEventListener("click", closeSettings);
  document.querySelectorAll("[data-theme]").forEach(b=>b.addEventListener("click", ()=>{
    state.theme=b.dataset.theme; save(); openSettings(); render();
  }));
  document.getElementById("soundSelect").addEventListener("change", e=>{ state.settings.sound=e.target.value; save(); });
  document.getElementById("vibToggle").addEventListener("change", e=>{ state.settings.vibration=e.target.checked; save(); });
  document.getElementById("wakeToggle").addEventListener("change", e=>{ state.settings.wakeLock=e.target.checked; save(); });
  document.getElementById("weakThresh").addEventListener("change", e=>{ state.settings.weakThreshold=parseFloat(e.target.value)||0; save(); });
  document.getElementById("notifPermBtn").addEventListener("click", ()=>{ if("Notification" in window) Notification.requestPermission(); });
  document.getElementById("exportBtn").addEventListener("click", exportData);
  document.getElementById("importFile").addEventListener("change", importData);
  document.getElementById("resetPointsBtn").addEventListener("click", ()=>{
    const pass = prompt("ادخل الباسورد عشان تصفّر المستوى:");
    if(pass===null) return;
    if(pass!=="400400"){ alert("باسورد غلط"); return; }
    if(!confirm("متأكد إنك عايز تصفّر نقاطك ومستواك؟")) return;
    state.points = 0;
    save(); openSettings(); render();
  });
}
function closeSettings(){ document.getElementById("modalRoot").innerHTML=""; }
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "mazakrati-backup-"+todayKey()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!confirm("استيراد هذه البيانات هيستبدل بياناتك الحالية. متأكد؟")) return;
       state = normalizeState(data);
      save(); closeSettings(); render();
    }catch(err){ alert("الملف غير صالح"); }
  };
  reader.readAsText(file);
}

/* ===================== EVENTS ===================== */
function bindEvents(){
  const q = sel => view.querySelector(sel);
  const qa = sel => view.querySelectorAll(sel);

  if(state.tab==="home"){
    q("#quickStart")?.addEventListener("click", ()=>{ requestNotificationPermission(); state.tab="timer"; save(); render(); setTimeout(()=>{ resetTimer(); beginSession(); },50); });
  }

  if(state.tab==="timer"){
    qa("[data-mode]").forEach(b=>b.addEventListener("click", ()=>{ if(timer.phase!=="idle") return; timer.mode=b.dataset.mode; render(); }));
    q("#btnStart")?.addEventListener("click", beginSession);
    q("#btnPause")?.addEventListener("click", pauseTimer);
    q("#btnResume")?.addEventListener("click", resumeTimer);
    q("#btnReset")?.addEventListener("click", resetTimer);
    q("#subjSelect")?.addEventListener("change", e=>{ timer.subjectId = e.target.value || null; });
     q("#simpleMinInput")?.addEventListener("change", e=>{ timer.simpleMinutes=Math.min(180,Math.max(1,parseInt(e.target.value)||25)); render(); });
    ["s_study","s_short","s_long","s_rounds","s_prep"].forEach(id=>{
      q("#"+id)?.addEventListener("change", e=>{
        const map={s_study:"studyMin",s_short:"shortBreak",s_long:"longBreak",s_rounds:"roundsUntilLong",s_prep:"prepMin"};
         const min = id==="s_prep" ? 0 : 1;
         const value = Number.parseInt(e.target.value, 10);
         if(Number.isFinite(value)) state.settings[map[id]] = Math.max(min, value);
        save();
      });
    });
  }

  if(state.tab==="grades"){
    q("#addSubjectBtn")?.addEventListener("click", ()=>{
      const name = q("#newSubjectName").value.trim();
      if(!name) return;
      state.subjects.push({id:uid(), name, grades:[]});
      save(); render();
    });
    qa("[data-sort]").forEach(b=>b.addEventListener("click", ()=>{ ui.grsort=b.dataset.sort; render(); }));
    qa("[data-toggle]").forEach(el=>el.addEventListener("click", ()=>{
      const box = document.getElementById("grades-"+el.dataset.toggle);
      box.style.display = box.style.display==="none" ? "block":"none";
    }));
    qa("[data-add-grade]").forEach(btn=>btn.addEventListener("click", ()=>{
      const sid = btn.dataset.addGrade;
      const subj = state.subjects.find(s=>s.id===sid);
      const score = parseFloat(q(`[data-gscore="${sid}"]`).value);
      const total = parseFloat(q(`[data-gtotal="${sid}"]`).value);
      const label = q(`[data-glabel="${sid}"]`).value.trim();
      const month = q(`[data-gmonth="${sid}"]`).value || currentMonthKey();
      if(!isFinite(score) || !isFinite(total) || total<=0) return;
      subj.grades.push({id:uid(), score, total, label, month, date:todayKey()});
      save(); render();
    }));
    qa("[data-del-grade]").forEach(btn=>btn.addEventListener("click", ()=>{
      const [sid,gid] = btn.dataset.delGrade.split("|");
      const subj = state.subjects.find(s=>s.id===sid);
      subj.grades = subj.grades.filter(g=>g.id!==gid);
      save(); render();
    }));
    qa("[data-del-subject]").forEach(btn=>btn.addEventListener("click", ()=>{
      if(!confirm("حذف المادة وكل درجاتها؟")) return;
      state.subjects = state.subjects.filter(s=>s.id!==btn.dataset.delSubject);
      save(); render();
    }));
  }

  if(state.tab==="schedule"){
    qa("[data-schedtab]").forEach(b=>b.addEventListener("click", ()=>{ ui.schedTab=b.dataset.schedtab; render(); }));
    q("#addRemBtn")?.addEventListener("click", ()=>{
      const title = q("#remTitle").value.trim();
      const dt = q("#remDatetime").value;
      if(!title || !dt) return;
      state.reminders.push({id:uid(), title, subjectId:q("#remSubject").value||null, datetime:dt, notes:q("#remNotes").value.trim()});
      save(); render();
    });
    qa("[data-del-rem]").forEach(btn=>btn.addEventListener("click", ()=>{
      state.reminders = state.reminders.filter(r=>r.id!==btn.dataset.delRem);
      save(); render();
    }));
    q("#addTodoBtn")?.addEventListener("click", ()=>{
      const text = q("#todoText").value.trim();
      if(!text) return;
      state.todos.push({id:uid(), text, done:false, subjectId:null, date:todayKey()});
      q("#todoText").value=""; save(); render();
    });
    qa("[data-toggle-todo]").forEach(cb=>cb.addEventListener("change", ()=>{
      const t = state.todos.find(x=>x.id===cb.dataset.toggleTodo);
      t.done = cb.checked;
      state.points = Math.max(0, state.points + (t.done ? 5 : -5));
      save(); render();
    }));
    qa("[data-del-todo]").forEach(btn=>btn.addEventListener("click", ()=>{
      const t = state.todos.find(x=>x.id===btn.dataset.delTodo);
      if(t && t.done) state.points = Math.max(0, state.points - 5);
      state.todos = state.todos.filter(t=>t.id!==btn.dataset.delTodo);
      save(); render();
    }));
  }

  if(state.tab==="free"){
    qa("[data-ftday]").forEach(b=>b.addEventListener("click", ()=>{ ui.ftDay=parseInt(b.dataset.ftday); render(); }));
    q("#ft_sleep")?.addEventListener("change", e=>{ state.freeTime.week[ui.ftDay].sleep=parseFloat(e.target.value)||0; save(); render(); });
    q("#ft_work")?.addEventListener("change", e=>{ state.freeTime.week[ui.ftDay].work=parseFloat(e.target.value)||0; save(); render(); });
    q("#ft_other")?.addEventListener("change", e=>{ state.freeTime.week[ui.ftDay].other=parseFloat(e.target.value)||0; save(); render(); });
    q("#suggestStart")?.addEventListener("click", ()=>{ requestNotificationPermission(); state.tab="timer"; save(); render(); setTimeout(()=>{ resetTimer(); beginSession(); },50); });
  }
}

/* ===================== INIT ===================== */
applyTheme();
render();
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) reconcileTimer(); });
window.addEventListener("pageshow", reconcileTimer);
window.addEventListener("focus", reconcileTimer);
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("./sw_1789040039534.js").catch(()=>{}); });
}
</script>
</body>
</html>
